<div class="auth-container">
    <form class="auth-form">

        <h1>Sign in</h1>

       <input type="text" name="username" placeholder="Username" [(ngModel)]="signin.username">

        <input type="password" name="password" placeholder="Password" [(ngModel)]="signin.password">

        <button type="button" class="btn btn-primary" (click)="commit()">SIGN IN</button>

        <span class="redirect-text">Don't have an account? <a [routerLink]="['/', 'auth','signup']">SIGN UP</a></span>
    </form>
</div>
